<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция экрана</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #screen {
            max-width: 100%;
            max-height: 85vh;
            border: 1px solid #444;
            margin-top: 10px;
        }

        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }

        #btnStart {
            background: #2e7d32;
            color: white;
        }

        #btnStop {
            background: #c62828;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-left: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Трансляция экрана</h2>

    <!-- Отображение IP и порта -->
    <div>Адрес для подключения: <b id="hostInfo"></b></div>

    <div id="controls">
        <button id="btnStart">▶ Запустить</button>
        <button id="btnStop" disabled>■ Остановить</button>
        <span id="status">Ожидание...</span>
    </div>

    <img id="screen" alt="Трансляция экрана" />

    <script>
        // Отображение адреса
        document.getElementById('hostInfo').textContent = window.location.host;

        const img = document.getElementById('screen');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusEl = document.getElementById('status');

        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            statusEl.textContent = 'Подключено. Нажмите «Запустить».';
        };

        // Приём кадров (бинарные данные)
        ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
                // Текстовое сообщение от сервера (статус)
                statusEl.textContent = event.data;
                return;
            }
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);
            img.src = url;
            img.onload = () => URL.revokeObjectURL(url);
        };

        ws.onerror = (err) => console.error('WebSocket ошибка:', err);
        ws.onclose = () => {
            statusEl.textContent = 'Соединение закрыто.';
            btnStart.disabled = true;
            btnStop.disabled = true;
        };

        // Кнопка «Запустить»
        btnStart.onclick = () => {
            ws.send('start');
            btnStart.disabled = true;
            btnStop.disabled = false;
        };

        // Кнопка «Остановить»
        btnStop.onclick = () => {
            ws.send('stop');
            btnStart.disabled = false;
            btnStop.disabled = true;
        };
    </script>
</body>
</html>
